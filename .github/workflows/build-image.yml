name: CodeFormer Docker Image

on:
  push:
    branches: [master, copilot/**]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.base'
      - 'requirements.txt'
      - 'web-demos/**'
      - 'VERSION'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version override (e.g., 0.1.0). Leave empty to auto-detect from VERSION.'
        required: false
        default: 'v20241010'
      rebuild_base:
        description: 'Force rebuild the base (models) image?'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  check-base:
    runs-on: ubuntu-latest
    outputs:
      base_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if base needs rebuild
        id: check
        run: |
          if [[ "${{ github.event.inputs.rebuild_base }}" == "true" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Manual rebuild requested"
          elif git diff --name-only HEAD~1 HEAD | grep -q "Dockerfile.base"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Dockerfile.base changed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Dockerfile.base not changed, skipping base build"
          fi

  build-base:
    runs-on: ubuntu-latest
    needs: check-base
    if: needs.check-base.outputs.base_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base

  determine-version:
    runs-on: ubuntu-latest
    needs: [check-base, build-base]
    if: always() && !failure() && !cancelled()
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            BASE_VERSION="${{ github.event.inputs.version }}"
            echo "Using manually provided version: $BASE_VERSION"
          else
            BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "Auto-detected version from VERSION: $BASE_VERSION"
          fi

          if [[ -z "$BASE_VERSION" ]]; then
            echo "::error::Could not determine base version from VERSION or input."
            exit 1
          fi

          TAGS=$(skopeo list-tags docker://ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]') 2>/dev/null | jq -r '.Tags[]?' || echo "")
          ESCAPED_VERSION="${BASE_VERSION//./\\.}"

          HIGHEST_REV=0
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if [[ $tag =~ ^${ESCAPED_VERSION}r([0-9]+)$ ]]; then
              REV=${BASH_REMATCH[1]}
              if [[ $REV -gt $HIGHEST_REV ]]; then
                HIGHEST_REV=$REV
              fi
            fi
          done <<< "$TAGS"

          NEXT_REV=$((HIGHEST_REV + 1))
          NEW_VERSION="${BASE_VERSION}r${NEXT_REV}"

          echo "========================================"
          echo "Base version : $BASE_VERSION"
          echo "Previous rev : r${HIGHEST_REV}"
          echo "Next version : $NEW_VERSION"
          echo "========================================"

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: [build-base, determine-version]
    if: always() && !failure() && !cancelled() && needs.determine-version.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.determine-version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ needs.determine-version.outputs.version }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY